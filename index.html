<!DOCTYPE html>
<html lang="vi">

<head>
   <meta charset="UTF-8" />
   <title>Shatranj</title>

   <style>
      body {
         margin: 0;
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
         background: #111;
         font-family: system-ui, sans-serif;
      }

      #board {
         display: grid;
         grid-template-columns: repeat(8, 70px);
         grid-template-rows: repeat(8, 70px);
         border: 4px solid #aaa;
      }

      .square {
         width: 70px;
         height: 70px;
         display: flex;
         justify-content: center;
         align-items: center;
         border: 1px solid #555;
         /* kẻ ô */
         box-sizing: border-box;
         cursor: pointer;
      }

      .square.light {
         background: #3b3b3b;
      }

      .square.dark {
         background: #262626;
      }

      img {
         width: 58px;
         height: 58px;
         pointer-events: none;
      }

      .selected {
         outline: 3px solid gold;
      }

      .move {
         background: rgba(0, 150, 255, 0.25) !important;
      }

      .check {
         box-shadow: inset 0 0 0 4px crimson;
      }

      .shah-mat {
         font-family: 'Cinzel', serif;
         font-size: 48px;
         color: #b30000;
         letter-spacing: 4px;
         animation: fadeIn 2s ease forwards;
         text-shadow: 0 0 15px rgba(180, 0, 0, 0.7);
      }

      @keyframes fadeIn {
         from {
            opacity: 0;
            transform: scale(1.1);
         }

         to {
            opacity: 1;
            transform: scale(1);
         }
      }


      #endgame {
         position: fixed;
         inset: 0;
         background: rgba(0, 0, 0, 0.85);
         display: none;
         justify-content: center;
         align-items: center;
         z-index: 10;
         opacity: 0;
         transition: opacity 1.5s ease;
         pointer-events: none;
      }

      #endgame.show {
         display: flex;
         opacity: 1;
         pointer-events: auto;
         /* 👈 chỉ chặn khi đang hiện */
      }

      #endgame.hide {
         opacity: 0;
      }

      #endgame span {
         font-family: 'Cinzel', serif;
         font-size: 52px;
         color: white;
         letter-spacing: 6px;
         text-shadow: 0 0 18px rgba(92, 92, 92, 0.7);
         animation: fadeIn 2s ease forwards;
      }

      #endgame.blue span {
         color: blue;
         text-shadow: 0 0 18px rgba(0, 0, 255);
      }

      #endgame.red span {
         color: red;
         text-shadow: 0 0 18px rgba(255, 0, 0);
      }

      #controls {
         display: flex;
         flex-direction: column;
         gap: 12px;

      }

      .control-btn {
         background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
         border: 1px solid #555;
         color: #eee;
         font-size: 16px;
         padding: 10px 18px;
         border-radius: 10px;
         cursor: pointer;
         letter-spacing: 1px;
         box-shadow:
            inset 0 0 8px rgba(255, 255, 255, 0.05),
            0 4px 10px rgba(0, 0, 0, 0.6);
         transition: all 0.2s ease;
      }

      .control-btn:hover {
         transform: translateY(-2px);
         box-shadow:
            inset 0 0 10px rgba(255, 255, 255, 0.08),
            0 6px 14px rgba(0, 0, 0, 0.8);
      }

      .control-btn:active {
         transform: translateY(0);
         box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
      }

      .control-btn.reset {
         border-color: #8b7f00;
         color: #fffecc;
      }

      #history {
         position: static;
         margin-bottom: 200px;
         top: 50%;
         width: 260px;
         max-height: 70vh;
         background: #181818;
         border: 1px solid #555;
         border-radius: 12px;
         padding: 12px;
         color: #ddd;
         overflow-y: auto;
         box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
         flex: 0 0 260px;
         /* chiều rộng cố định */
         max-height: 70vh;
         overflow-y: auto;
         position: relative;
         /* 🔥 neo cho hoverHint */
      }


      #history h3 {
         text-align: center;
         margin: 0 0 10px;
         font-family: 'Cinzel', serif;
         letter-spacing: 2px;
      }

      #historyList {
         padding-left: 18px;
         font-size: 14px;
         max-height: 150px;
      }

      #historyList li {
         margin-bottom: 6px;
         opacity: 0.9;
      }

      #layout {
         display: flex;
         justify-content: center;
         align-items: center;
         gap: 30px;
         min-width: calc(200px + 560px + 260px + 60px);
         position: relative;
         /* 🔥 mốc cho hoverHint */
      }

      #left-panel {
         width: 200px;
         display: flex;
         flex-direction: column;
         align-items: center;
         gap: 24px;
      }

      #game {
         display: flex;
         justify-content: center;
         align-items: center;
         flex: 0 0 auto;
      }

      #shahAlert {
         font-family: 'Cinzel', serif;
         font-size: 38px;
         letter-spacing: 6px;
         color: rgb(213, 220, 20);
         text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
         opacity: 0;
         transition: opacity 0.4s ease;
      }

      #shahAlert.show {
         opacity: 1;
      }

      .game-layout {
         display: flex;
         gap: 16px;
         height: 100vh;
         padding: 16px;
         box-sizing: border-box;
      }

      .piece-info {
         width: 260px;
         background: #1a1a1a;
         color: #eee;
         padding: 12px;
         overflow-y: auto;
         border-radius: 8px;
      }

      .board-area {
         flex: 1;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
      }

      .piece {
         position: relative;
         width: 58px;
         height: 58px;
      }

      .piece-tooltip {
         position: absolute;
         bottom: 0%;
         left: 100%;


         color: yellow;
         font-weight: bold;
         border: 1px solid #666;
         border-radius: 6px;
         padding: 6px 8px;

         font-size: 13px;
         line-height: 1.4;
         white-space: nowrap;

         opacity: 0;
         pointer-events: none;
         transition: opacity 0.2s ease;
         z-index: 20;
         background: rgba(0, 0, 0, 0.85);
         box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);

      }

      .piece:hover .piece-tooltip {
         opacity: 1;
      }

      .rule {
         color: yellow;
      }

      #hoverHint {
         position: absolute;
         bottom: 16px;

         font-size: 14px;
         opacity: 0.65;
         font-style: italic;
         color: #cfcfcf;

         text-align: left;
         pointer-events: none;
         /* 👈 không cản click */

         max-width: 300px;
         /* 🔥 giới hạn chiều ngang */
         white-space: normal;
         /* cho phép xuống dòng */
         line-height: 1.4;
      }

      .check {
         animation: pulse 0.8s ease-in-out infinite alternate;
      }

      @keyframes pulse {
         from {
            box-shadow: inset 0 0 0 3px crimson;
         }

         to {
            box-shadow: inset 0 0 0 5px crimson;
         }
      }

      #turnIndicator {
         font-family: 'Cinzel', serif;
         font-size: 26px;
         letter-spacing: 2px;

         text-align: center;
         margin-bottom: 140px;
         padding: 6px 0;

         transition: all 0.3s ease;
      }

      /* XANH */
      #turnIndicator.blue {
         color: blue;
         text-shadow:
            0 0 6px rgb(31, 31, 255),
            0 0 14px rgb(101, 101, 255);
      }

      /* ĐỎ */
      #turnIndicator.red {
         color: red;
         text-shadow:
            0 0 6px rgb(255, 41, 41),
            0 0 14px rgb(255, 105, 105);
      }

      /* === MOBILE FIRST === */
      @media (max-width: 768px) {

         /* === BẺ LAYOUT NGANG === */
         #layout {
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: unset;
         }

         /* === ẨN PANEL PHỤ === */
         #left-panel,
         #right-panel {
            display: none;
         }

         /* === BOARD LÀ TRUNG TÂM === */
         #game {
            width: 100%;
            display: flex;
            justify-content: center;
         }

         #board {
            width: 92vw;
            height: 92vw;
            max-width: 360px;
            max-height: 360px;
         }
      }
   </style>
</head>

<body>
   <div id="layout">
      <div id="left-panel">
         <div id="shahAlert">SHĀH!</div>

         <div id="controls">
            <button class="control-btn" onclick="location.href='codex.html'">
               📜 Codex
            </button>
            <button class="control-btn" onclick="undo()">⟲ Undo</button>
            <button class="control-btn" onclick="redo()">⟳ Redo</button>
            <button class="control-btn reset" onclick="resetGame()">⟲ Reset</button>
         </div>
         <div class="turtorialtowin">
            <section>
               <div class="rule">
                  <strong>Shāh</strong> — Vua bị chiếu.
               </div>

               <div class="rule">
                  <strong>Shāh Māt</strong> — Vua không thể thoát chiếu.
               </div>

               <div class="rule">
                  <strong>Shāh Tanhā</strong> — Vua đơn độc. Được đi một nước cuối.
               </div>

               <div class="rule">
                  <strong>Zindān</strong> — Hết nước đi. Bị xử thua.
               </div>

               <div class="rule">
                  <strong>Do Shāh</strong> — Chỉ còn hai vua. Hòa.
               </div>
            </section>
         </div>
      </div>

      <div id="game">
         <div id="board"></div>
      </div>
      <div id="right-panel">

         <div id="turnIndicator" class="blue">LƯỢT XANH</div>


         <div id="history">
            <h3>📜 Chronicle</h3>
            <ol id="historyList"></ol>
         </div>

         <div id="hoverHint">
            ℹ️ Di chuột lên quân cờ để xem tên và cách di chuyển
         </div>
      </div>

      <script>
         const R = (type) => ({ type, color: "red" });
         const B = (type) => ({ type, color: "blue" });
         const boardEl = document.getElementById("board");


         const PIECE_IMG = (color, type) =>
            `assets/placeholder/${color}/${type}.png`;



         let selected = null;
         let turn = "blue";
         let gameOver = false;
         let lastChance = null;
         let history = [];
         let historyIndex = -1;
         let moveLog = [];


         /*
           HÀNG TRÊN: RED
           HÀNG DƯỚI: BLUE
         */
         const board = [
            [R("rukh"), R("faras"), R("fil"), R("farzin"), R("shah"), R("fil"), R("faras"), R("rukh")],
            Array(8).fill(null).map(() => R("baidaq")),
            ...Array.from({ length: 4 }, () => Array(8).fill(null)),
            Array(8).fill(null).map(() => B("baidaq")),
            [B("rukh"), B("faras"), B("fil"), B("farzin"), B("shah"), B("fil"), B("faras"), B("rukh")]
         ];

         const INITIAL_BOARD = deepCopyBoard(board);

         function draw() {
            boardEl.innerHTML = "";

            board.forEach((row, r) => {
               row.forEach((piece, c) => {
                  const sq = document.createElement("div");
                  sq.className = "square " + ((r + c) % 2 === 0 ? "light" : "dark");
                  sq.onclick = () => clickSquare(r, c);

                  if (piece) {
                     const wrapper = document.createElement("div");
                     wrapper.className = "piece";

                     const img = document.createElement("img");
                     img.src = PIECE_IMG(piece.color, piece.type);

                     const tooltip = document.createElement("div");
                     tooltip.className = "piece-tooltip";
                     tooltip.innerHTML = getPieceInfo(piece);

                     wrapper.appendChild(img);
                     wrapper.appendChild(tooltip);
                     sq.appendChild(wrapper);
                  }

                  boardEl.appendChild(sq);
               });
            });

            highlightCheck();
         }

         function getPieceInfo(piece) {
            const info = {
               shah: "Shāh (Vua)<br>Đi 1 ô mọi hướng<br>Bị chiếu không được bỏ qua",
               farzin: "Farzīn (Tể tướng)<br>Đi chéo 1 ô",
               rukh: "Rukh (Xe)<br>Đi thẳng ngang dọc",
               faras: "Faras / Asb (Mã)<br>Đi chữ L<br>Không bị cản",
               fil: "Pīl (Tượng)<br>Đi chéo đúng 2 ô<br>Không bị cản",
               baidaq: "Baidaq / Sarbaz / Piyadeh (Tốt)<br>Đi thẳng 1 ô<br>Ăn chéo 1 ô<br>Đến cuối bàn cờ phong farzin"
            };

            return info[piece.type];
         }

         function deepCopyBoard(board) {
            return board.map(row =>
               row.map(p => p ? { ...p } : null)
            );
         }

         function saveHistory() {
            history = history.slice(0, historyIndex + 1);

            history.push({
               board: deepCopyBoard(board),
               turn,
               lastChance,
               moveLog: [...moveLog]
            });

            historyIndex++;
         }

         function moveNotation(piece, sr, sc, tr, tc, capture) {
            const file = "abcdefgh";
            return `${piece.type[0].toUpperCase()}${file[sc]}${8 - sr} → ${file[tc]}${8 - tr}${capture ? "×" : ""}`;
         }



         function resetGame() {
            board.length = 0;
            INITIAL_BOARD.forEach(row =>
               board.push(row.map(p => p ? { ...p } : null))
            );

            turn = "blue";
            lastChance = null;
            gameOver = false;

            history = [];
            historyIndex = -1;
            moveLog = [];
            updateHistory();
            updateTurnIndicator();


            saveHistory(); // 🔥 CỰC KỲ QUAN TRỌNG

            draw();
         }




         function clickSquare(r, c) {
            const piece = board[r][c];

            if (gameOver) return;
            if (!selected) {
               if (piece && piece.color === turn) {
                  clearHighlights();
                  selected = { r, c };
                  highlight(r, c);
                  highlightMoves(r, c);
                  playSFX("select", 0.1);
               }
            } else {
               if (isLegalMove(selected.r, selected.c, r, c)) {
                  move(selected.r, selected.c, r, c);
               }
               selected = null;
               clearHighlights();
               draw();
            }
         }
         function move(sr, sc, tr, tc) {

            const piece = board[sr][sc];
            const enemy = piece.color === "blue" ? "red" : "blue";
            const target = board[tr][tc];
            if (target) {
               playSFX("capture", 0.5);
            } else {
               playSFX("move", 0.35);
            }


            // ===== NƯỚC CUỐI CỦA SHĀH TANHĀ =====
            if (lastChance === piece.color) {


               board[tr][tc] = piece;
               board[sr][sc] = null;
               lastChance = null;

               saveHistory();        // 🔥 BẮT BUỘC
               selected = null;


               draw();

               // 1. Ăn được vua → thắng ngay
               if (target && target.type === "shah") {
                  endGame(`${piece.color.toUpperCase()} TRIUMPHS — SHĀH MĀT!`, piece.color);
                  return;
               }

               // 2. Sau nước cuối, nếu chỉ còn 2 vua → hòa
               if (onlyTwoKings()) {
                  endGame("DRAW — DO SHĀH!");
                  playSFX('draw', 0.5);
                  return;
               }

               // 3. Ngược lại → vua đơn độc thua
               endGame(`${enemy.toUpperCase()} TRIUMPHS — SHĀH TANHĀ!`, enemy);
               playSFX('mate', 0.5);
               return;
            }

            board[tr][tc] = piece;
            board[sr][sc] = null;

            // phong baidaq
            if (piece.type === "baidaq") {
               if (
                  (piece.color === "blue" && tr === 0) ||
                  (piece.color === "red" && tr === 7)
               ) {
                  piece.type = "farzin";
               }
            }

            if (isInCheck(enemy) && !hasAnyLegalMove(enemy)) {
               endGame(`${piece.color.toUpperCase()} TRIUMPHS — SHĀH MĀT!`, piece.color);
               return;
            }

            if (onlyTwoKings()) {
               endGame("DRAW — DO SHĀH!");
               return;
            }

            // ===== HẾT NƯỚC ĐI → THUA (LUẬT SHATRANJ) =====
            if (!hasAnyLegalMove(enemy)) {
               endGame(
                  `${piece.color.toUpperCase()} TRIUMPHS — ZINDĀN!`,
                  piece.color
               );
               return;
            }

            function endGame(text, winner = null) {
               gameOver = true;
               lastChance = null;
               selected = null;
               clearHighlights();
               draw();
               showEnd(text, winner);
            }

            if (onlyKingLeft(enemy)) {
               lastChance = enemy;
               turn = enemy;
               draw();
               return;
            }
            saveHistory();
            turn = enemy;
            updateTurnIndicator();

            const capture = board[tr][tc] !== null;
            moveLog.push(
               shatranjNotation(piece, sr, sc, tr, tc, capture)
            );

            updateHistory();
         }

         function updateHistory() {
            const list = document.getElementById("historyList");
            list.innerHTML = "";
            moveLog.forEach((m, i) => {
               const li = document.createElement("li");
               li.textContent = `${i + 1}. ${m}`;
               list.appendChild(li);
            });
         }


         function undo() {
            if (historyIndex <= 0) return;

            historyIndex--;
            const state = history[historyIndex];

            board.length = 0;
            state.board.forEach(row =>
               board.push(row.map(p => p ? { ...p } : null))
            );

            turn = state.turn;
            lastChance = state.lastChance;
            moveLog = [...state.moveLog];
            updateHistory();
            updateTurnIndicator();

            gameOver = false;
            draw();
         }

         function redo() {
            if (historyIndex >= history.length - 1) return;

            historyIndex++;
            const state = history[historyIndex];

            board.length = 0;
            state.board.forEach(row =>
               board.push(row.map(p => p ? { ...p } : null))
            );

            turn = state.turn;
            lastChance = state.lastChance;
            moveLog = [...state.moveLog];
            updateHistory();
            updateTurnIndicator();

            gameOver = false;
            draw();
         }

         function showEnd(text, winner = null) {
            gameOver = true;
            lastChance = null;

            let end = document.getElementById("endgame");

            if (text.includes("SHĀH MĀT") || text.includes("ZINDĀN")) {
               playSFX("mate", 0.8);
               setTimeout(playSFX, 300);
            } else if (text.includes("DO SHĀH")) {
               playSFX("draw", 0.8);
            }
            if (!end) {
               end = document.createElement("div");
               end.id = "endgame";
               document.body.appendChild(end);
            }

            end.className = "";
            if (winner) end.classList.add(winner);

            end.innerHTML = `<span>${text}</span>`;
            end.style.display = "flex";
            end.classList.add("show");

            setTimeout(() => {
               end.classList.remove("show");
               end.classList.add("hide");
            }, 4000);
         }



         function highlight(r, c) {
            const index = r * 8 + c;
            boardEl.children[index].classList.add("selected");
         }

         function inBoard(r, c) {
            return r >= 0 && r < 8 && c >= 0 && c < 8;
         }

         function isEnemy(piece, target) {
            return target && piece.color !== target.color;
         }

         function isValidMove(sr, sc, tr, tc) {
            const piece = board[sr][sc];
            const target = board[tr][tc];
            if (!piece) return false;
            if (target && target.color === piece.color) return false;



            // tiếp tục kiểm tra luật quân cờ


            const dr = tr - sr;
            const dc = tc - sc;


            switch (piece.type) {

               case "shah":
                  return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;

               case "farzin":
                  return Math.abs(dr) === 1 && Math.abs(dc) === 1;

               case "rukh":
                  if (dr !== 0 && dc !== 0) return false;
                  return clearPath(sr, sc, tr, tc);

               case "faras":
                  return (
                     (Math.abs(dr) === 2 && Math.abs(dc) === 1) ||
                     (Math.abs(dr) === 1 && Math.abs(dc) === 2)
                  );

               case "fil":
                  return Math.abs(dr) === 2 && Math.abs(dc) === 2;

               case "baidaq":
                  const dir = piece.color === "blue" ? -1 : 1;

                  // đi thẳng
                  if (dc === 0 && dr === dir && !target) return true;

                  // ăn chéo
                  if (Math.abs(dc) === 1 && dr === dir && target) return true;

                  return false;
            }

            return false;
         }

         function isLegalMove(sr, sc, tr, tc) {
            if (!isValidMove(sr, sc, tr, tc)) return false;

            const piece = board[sr][sc];
            const backup = board[tr][tc];

            // giả lập
            board[tr][tc] = piece;
            board[sr][sc] = null;

            const illegal = isInCheck(piece.color);

            // hoàn tác
            board[sr][sc] = piece;
            board[tr][tc] = backup;

            return !illegal;
         }

         function highlightMoves(sr, sc) {
            for (let r = 0; r < 8; r++) {
               for (let c = 0; c < 8; c++) {
                  if (isLegalMove(sr, sc, r, c)) {
                     const idx = r * 8 + c;
                     boardEl.children[idx].classList.add("move");
                  }
               }
            }
         }

         function clearHighlights() {
            document.querySelectorAll(".selected, .move")
               .forEach(el => el.classList.remove("selected", "move"));
         }


         function clearPath(sr, sc, tr, tc) {
            const stepR = Math.sign(tr - sr);
            const stepC = Math.sign(tc - sc);

            let r = sr + stepR;
            let c = sc + stepC;

            while (r !== tr || c !== tc) {
               if (board[r][c]) return false;
               r += stepR;
               c += stepC;
            }

            return true;
         }

         function findShah(color) {
            for (let r = 0; r < 8; r++) {
               for (let c = 0; c < 8; c++) {
                  const p = board[r][c];
                  if (p && p.type === "shah" && p.color === color) {
                     return { r, c };
                  }
               }
            }
            return null;
         }

         function canAttack(sr, sc, tr, tc) {
            const piece = board[sr][sc];
            const target = board[tr][tc];
            if (!piece) return false;
            if (target && target.color === piece.color) return false;

            const dr = tr - sr;
            const dc = tc - sc;

            switch (piece.type) {
               case "shah":
                  return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;

               case "farzin":
                  return Math.abs(dr) === 1 && Math.abs(dc) === 1;

               case "rukh":
                  if (dr !== 0 && dc !== 0) return false;
                  return clearPath(sr, sc, tr, tc);

               case "faras":
                  return (
                     (Math.abs(dr) === 2 && Math.abs(dc) === 1) ||
                     (Math.abs(dr) === 1 && Math.abs(dc) === 2)
                  );

               case "fil":
                  return Math.abs(dr) === 2 && Math.abs(dc) === 2;

               case "baidaq": {
                  const dir = piece.color === "blue" ? -1 : 1;
                  return Math.abs(dc) === 1 && dr === dir;
               }
            }
            return false;
         }

         function hasAnyLegalMove(color) {
            for (let sr = 0; sr < 8; sr++) {
               for (let sc = 0; sc < 8; sc++) {
                  const piece = board[sr][sc];
                  if (!piece || piece.color !== color) continue;

                  for (let tr = 0; tr < 8; tr++) {
                     for (let tc = 0; tc < 8; tc++) {
                        if (!isValidMove(sr, sc, tr, tc)) continue;

                        // giả lập
                        const backup = board[tr][tc];
                        board[tr][tc] = piece;
                        board[sr][sc] = null;

                        const safe = !isInCheck(color);

                        // hoàn tác
                        board[sr][sc] = piece;
                        board[tr][tc] = backup;

                        if (safe) return true;
                     }
                  }
               }
            }
            return false;
         }


         function isInCheck(color) {
            const king = findShah(color);
            if (!king) return true;

            for (let r = 0; r < 8; r++) {
               for (let c = 0; c < 8; c++) {
                  const p = board[r][c];
                  if (p && p.color !== color) {
                     if (canAttack(r, c, king.r, king.c)) {
                        return true;
                     }
                  }
               }
            }
            return false;
         }


         function highlightCheck() {
            let checkFound = false;

            ["blue", "red"].forEach(color => {
               const k = findShah(color);
               if (!k) return;

               if (isInCheck(color)) {
                  const idx = k.r * 8 + k.c;
                  boardEl.children[idx].classList.add("check");
                  checkFound = true;
               }
            });

            const alert = document.getElementById("shahAlert");
            const wasShowing = alert.classList.contains("show");

            alert.classList.toggle("show", checkFound);

            if (checkFound && !wasShowing) {
               playSFX("check", 0.6);
            }
         }


         function onlyKingLeft(color) {
            let count = 0;
            for (let r = 0; r < 8; r++) {
               for (let c = 0; c < 8; c++) {
                  const p = board[r][c];
                  if (p && p.color === color) count++;
               }
            }
            return count === 1;
         }

         function onlyTwoKings() {
            let kings = 0;
            let pieces = 0;

            for (let r = 0; r < 8; r++) {
               for (let c = 0; c < 8; c++) {
                  const p = board[r][c];
                  if (p) {
                     pieces++;
                     if (p.type === "shah") kings++;
                  }
               }
            }

            return pieces === 2 && kings === 2;
         }

         function shatranjNotation(piece, sr, sc, tr, tc, capture) {
            const file = "abcdefgh";
            const name = {
               shah: "Shāh",
               farzin: "Farzīn",
               rukh: "Rukh",
               faras: "Faras",
               fil: "Fīl",
               baidaq: "Baidaq"
            }[piece.type];

            return `${name} ${file[sc]}${8 - sr} → ${file[tc]}${8 - tr}${capture ? " ×" : ""}`;
         }

         function updateTurnIndicator() {
            const el = document.getElementById("turnIndicator");
            if (!el) return;

            el.classList.remove("blue", "red");

            if (turn === "blue") {
               el.textContent = "LƯỢT XANH";
               el.classList.add("blue");
            } else {
               el.textContent = "LƯỢT ĐỎ";
               el.classList.add("red");
            }
         }

         const SFX = {
            select: new Audio("sounds/select.mp4"),
            move: new Audio("sounds/move.mp4"),
            capture: new Audio("sounds/capture.mp4"),
            check: new Audio("sounds/check.mp4"),
            mate: new Audio("sounds/mate.mp4"),
            draw: new Audio("sounds/draw.mp4"),
         };

         let soundEnabled = true;

         function playSFX(name, volume = 1) {
            if (!soundEnabled) return;

            const s = SFX[name];
            if (!s) return;

            s.pause();
            s.currentTime = 0;
            s.volume = volume;
            s.play().catch(() => { });
         }



         draw();
         updateTurnIndicator();
      </script>
</body>
